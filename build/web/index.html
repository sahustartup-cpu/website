<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SahuStartup — Digital Design Studio">
  <title>SahuStartup</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    body {
      background-color: #0a0a0a;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      z-index: 9999;
    }
    #loading h1 {
      color: #f5f4f0;
      font-family: sans-serif;
      font-size: 28px;
      letter-spacing: -1px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="loading"></div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
